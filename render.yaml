# =============================================================================
# render.yaml — Render Infrastructure as Code
# =============================================================================
# هذا الملف يُعرّف كل خدمات المشروع على Render.
# وثائق: https://render.com/docs/blueprint-spec
#
# الاستخدام:
#   1. ارفع الكود على GitHub
#   2. في Render Dashboard: New → Blueprint → ربط المستودع
#   3. Render سيقرأ هذا الملف وينشئ الخدمات تلقائياً
# =============================================================================

services:
  # ─── خدمة الويب الرئيسية (Django + React) ──────────────────────────────────
  - type: web
    name: number-platform-api
    runtime: python
    region: frankfurt         # اختر المنطقة الأقرب لمستخدميك
    plan: starter             # free | starter | standard | pro

    # ── الخيارات المتعلقة بالبناء ──────────────────────────────────────────
    buildCommand: "./build.sh"
    # ‎--timeout 600‎ لا 120: ضغط الوسائط كلها في نسخة احتياطية يتجاوز
    # الدقيقتين، فكان gunicorn يقتل الـ worker في منتصف العمل — وهو سبب
    # فشل النسخة "الكاملة" و"الملفات فقط" بينما تنجح "قاعدة البيانات".
    #
    # ‎--threads 6‎ لا 2: تنزيل حزمة من المتجر يحتجز خيطاً لدقائق على
    # اتصال بطيء، وأربع فتحات تعني أن أربعة تنزيلات متزامنة توقف المنصة
    # كلها. الخيوط شبه مجانية ذاكرياً لأنها تتشارك مساحة الـ worker.
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 6 --timeout 600 --log-level info"

    # ── التخزين الدائم لملفات الوسائط ─────────────────────────────────────
    disk:
      name: media-storage
      mountPath: /var/data/media
      sizeGB: 10

    # ── متغيرات البيئة ─────────────────────────────────────────────────────
    envVars:
      # Django Core
      - key: SECRET_KEY
        generateValue: true           # Render يولّد مفتاحاً آمناً تلقائياً

      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.12.0"

      # مسار التخزين الدائم للملفات الوسائطية المرفوعة
      - key: MEDIA_ROOT
        value: "/var/data/media"

      # النسخ الاحتياطية على نفس القرص الدائم، داخل مجلد مخفي.
      # config/urls.py يستثني ".backups" من مسار /media/ العام حتى لا
      # تُنزَّل نسخة قاعدة البيانات بلا مصادقة.
      - key: BACKUP_STORAGE_DIR
        value: "/var/data/media/.backups"

      # ALLOWED_HOSTS: يُضاف دومين Render تلقائياً + أي دومين مخصص
      # استبدل number-platform-api.onrender.com بالدومين الفعلي بعد النشر
      - key: ALLOWED_HOSTS
        value: "numberoneplatform.onrender.com"

      # CORS & CSRF: يجب أن يطابق عنوان الـ Frontend
      - key: CORS_ALLOWED_ORIGINS
        value: "https://numberoneplatform.onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://numberoneplatform.onrender.com"

      # Cookies آمنة في HTTPS
      - key: COOKIE_SECURE
        value: "True"

      # DATABASE_URL: يُحقن تلقائياً من قاعدة البيانات المرتبطة أدناه
      - key: DATABASE_URL
        fromDatabase:
          name: number-platform-db
          property: connectionString

# ─── قاعدة بيانات PostgreSQL ────────────────────────────────────────────────
databases:
  - name: number-platform-db
    databaseName: number_platform
    user: number_platform_user
    region: frankfurt
    plan: basic-256mb         # يطابق الخطة القائمة فعلاً
