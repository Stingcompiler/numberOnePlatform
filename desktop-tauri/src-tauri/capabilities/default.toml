# ما تُسمح به الواجهة، وسبب كل بند.
#
# TOML لا JSON، لأن البرومبت يطلب سبباً في تعليق لكل صلاحية، وJSON لا يحمل
# تعليقات. Tauri v2 يقرأ الصيغتين.
#
# القاعدة: لا يُضاف بند إلا عند وجود شاشة تحتاجه فعلاً. الدفعة ١ لا تحتاج
# شيئاً تقريباً — لا نظام ملفات، ولا شبكة من الواجهة، ولا حافظة، ولا فتح
# روابط. تُضاف مع الدفعات التي تحتاجها.

identifier = "default"
description = "أضيق مجموعة تكفي الدفعة ١: نافذة واحدة، وأمر واحد يقرأ حالة الحماية."
windows = ["main"]

permissions = [
  # إظهار النافذة بعد أن يجهز محتواها. بدونه تظهر النافذة بيضاء لحظة الإقلاع.
  "core:window:allow-show",

  # إغلاق النافذة من زر داخل الواجهة عند الحاجة لاحقاً (تسجيل الخروج).
  "core:window:allow-close",

  # قراءة السمة التي يفضّلها النظام. الافتراضي فاتح، لكن التبديل يحتاجها.
  "core:window:allow-theme",
]
